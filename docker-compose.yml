services:
  redis:
    image: redis:7-alpine
    container_name: trackdeal-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackdeal-api
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-trackdeal-d0227}
      - FCM_SERVICE_ACCOUNT_PATH=${FCM_SERVICE_ACCOUNT_PATH:-firebase-service-account.json}
    depends_on:
      - redis
    command: sh -c "npm install && npm run dev"

volumes:
  redis_data:
    driver: local
